name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check-changeset:
    name: Check for Changeset
    runs-on: ubuntu-latest
    # Only require changeset for PRs to main (not for dev branch PRs)
    if: >
      github.event_name == 'pull_request' && 
      github.base_ref == 'main' &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }} || {
            echo "❌ No changeset detected. Please run 'pnpm changeset' to add one."
            exit 1
          }

  build-test-lint-matrix:
    name: build-test-lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and critical)
        if: matrix.node == 22
        run: pnpm audit --audit-level=high
      - run: pnpm format:check
        if: matrix.node == 22
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
        if: matrix.node == 22
      - run: pnpm test

  browser-tests:
    name: browser-tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @mohsinonxrm/dataverse-sdk-browser-tests exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # The SPA sample's Playwright smoke tests (demo mode, no org needed). Both steps are
      # skipped while the sample has no test:e2e script. The sample pins its own Playwright
      # version, so it installs its own Chromium build.
      - name: Install Chromium for the SPA sample
        run: |
          if grep -q '"test:e2e"' samples/spa-fluentui-v9/package.json; then
            pnpm --filter spa-fluentui-v9-sample exec playwright install --with-deps chromium
          fi
      - name: SPA sample e2e tests
        run: pnpm --filter spa-fluentui-v9-sample --if-present test:e2e

  # Branch protection requires a check named exactly "build-test-lint". This job reports it,
  # and passes only if every Node version in the matrix and the browser tests passed, so the
  # required check doesn't change when the jobs do.
  build-test-lint:
    name: build-test-lint
    runs-on: ubuntu-latest
    needs: [build-test-lint-matrix, browser-tests]
    if: always()
    steps:
      - name: All Node versions and the browser tests passed
        env:
          MATRIX: ${{ needs.build-test-lint-matrix.result }}
          BROWSER: ${{ needs.browser-tests.result }}
        run: |
          echo "Node matrix: $MATRIX, browser tests: $BROWSER"
          test "$MATRIX" = "success" && test "$BROWSER" = "success"
