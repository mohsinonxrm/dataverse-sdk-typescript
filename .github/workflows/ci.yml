name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check-changeset:
    name: Check for Changeset
    runs-on: ubuntu-latest
    # Only require changeset for PRs to main (not for dev branch PRs)
    if: >
      github.event_name == 'pull_request' && 
      github.base_ref == 'main' &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }} || {
            echo "❌ No changeset detected. Please run 'pnpm changeset' to add one."
            exit 1
          }

  build-test-lint-matrix:
    name: build-test-lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and critical)
        if: matrix.node == 22
        run: pnpm audit --audit-level=high
      - run: pnpm format:check
        if: matrix.node == 22
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
        if: matrix.node == 22
      - run: pnpm test

  # Branch protection requires a check named exactly "build-test-lint". This job reports it,
  # and passes only if every Node version in the matrix passed, so the required check doesn't
  # change when the matrix does.
  build-test-lint:
    name: build-test-lint
    runs-on: ubuntu-latest
    needs: build-test-lint-matrix
    if: always()
    steps:
      - name: All Node versions passed
        env:
          RESULT: ${{ needs.build-test-lint-matrix.result }}
        run: |
          echo "Matrix result: $RESULT"
          test "$RESULT" = "success"
