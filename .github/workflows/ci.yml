name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check-changeset:
    name: Check for Changeset
    runs-on: ubuntu-latest
    # Only require changeset for PRs to main (not for dev branch PRs)
    if: >
      github.event_name == 'pull_request' && 
      github.base_ref == 'main' &&
      !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: |
          pnpm changeset status --since=origin/${{ github.base_ref }} || {
            echo "❌ No changeset detected. Please run 'pnpm changeset' to add one."
            exit 1
          }

  build-test-lint:
    name: build-test-lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        if: matrix.node == 20
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
        if: matrix.node == 20
      - run: pnpm test
