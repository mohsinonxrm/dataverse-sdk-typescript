name: Site

# Builds the explorer site (samples/spa-fluentui-v9) and deploys it to Azure Static Web Apps
# (#298). It deploys the current stable release: pushes to main, or by hand (Actions → Site → Run
# workflow). Until the maintainer has created the Static Web App and stored its deployment token
# as the AZURE_STATIC_WEB_APPS_API_TOKEN secret (docs/site.md), the site is still built, and the
# deploy step is skipped with a notice.
#
# The site has no backend and no secrets: visitors sign in to their own environment with MSAL in
# the browser. Optional repository variables give the sign-in form its defaults:
# EXPLORER_CLIENT_ID (a multi-tenant SPA app registration) and EXPLORER_TENANT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build the SDK packages the site uses
        run: pnpm exec turbo run build --filter="spa-fluentui-v9-sample^..."
      # Built outside turbo, so the VITE_ variables reach Vite whatever turbo's env mode
      - name: Build the site
        env:
          VITE_AZURE_CLIENT_ID: ${{ vars.EXPLORER_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.EXPLORER_TENANT_ID }}
        run: pnpm --filter spa-fluentui-v9-sample build
      - name: Check for the deployment token
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Site not deployed::The AZURE_STATIC_WEB_APPS_API_TOKEN secret isn't set, so the site was built but not deployed. See docs/site.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Uploads the built site as it is (no Oryx build). staticwebapp.config.json is in the build
      # output, copied from samples/spa-fluentui-v9/public.
      - name: Deploy to Azure Static Web Apps
        if: steps.token.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: samples/spa-fluentui-v9/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          # A run by hand on another branch deploys a preview environment, not production
          production_branch: main
