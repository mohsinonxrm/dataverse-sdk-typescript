name: Generate Metadata Types
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: pnpm generate:metadata-types
      - name: Create PR with generated changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(generated): regenerate metadata types"
          branch: "auto/generate-metadata-types"
          delete-branch: true
          title: "chore(generated): regenerate metadata types"
          body: |
            Automated PR to update generated metadata types.
            Triggered by: workflow_dispatch
          labels: "automated,generated"
