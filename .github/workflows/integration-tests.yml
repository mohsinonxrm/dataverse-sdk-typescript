name: Integration Tests
on:
  workflow_dispatch:
  schedule:
    # Nightly against the dev org (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

# One live run at a time: the tests share one org.
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Forks don't get the secrets; don't run there.
    if: github.repository == 'mohsinonxrm/dataverse-sdk-typescript'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run live integration tests
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          # Fail instead of silently skipping if a secret is missing.
          DATAVERSE_INTEGRATION_REQUIRED: "1"
        run: pnpm test:integration
      # The non-interactive Node samples, end to end against the same org. Same job, so it stays
      # in the concurrency group; each sample deletes what it creates and exits non-zero on any
      # failure. Runs even when the tests failed, so one run reports both.
      - name: Run the Node samples against the live org
        if: ${{ !cancelled() }}
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          DATAVERSE_INTEGRATION_REQUIRED: "1"
        run: pnpm samples:live --no-build
      # Delete what earlier runs left behind: records named with the tests' and samples' prefixes
      # (sdk-it-, sdk-int , sdk-sample-) created more than 2 hours ago, so this run's records and
      # any run in progress are never touched. Test schema is only listed. Same job, so it stays
      # in the concurrency group; runs whatever happened to the steps before it.
      - name: Sweep records left by earlier runs
        if: always()
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
        run: node packages/dataverse-sdk-integration-tests/scripts/sweep.mjs --delete
