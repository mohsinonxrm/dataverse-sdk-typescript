name: Integration Tests
on:
  workflow_dispatch:
  schedule:
    # Nightly against the dev org (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

# One live run at a time: the tests share one org.
concurrency:
  group: integration-tests
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Forks don't get the secrets; don't run there.
    if: github.repository == 'mohsinonxrm/dataverse-sdk-typescript'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run live integration tests
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          # Fail instead of silently skipping if a secret is missing.
          DATAVERSE_INTEGRATION_REQUIRED: "1"
        run: pnpm test:integration
