name: Release

# Pushing a vX.Y.Z (or vX.Y.Z-beta.N / -rc.N) tag publishes all 16 packages to npm through
# trusted publishing (no npm token) and creates the GitHub Release. See RELEASING.md (#365).
# Running it by hand (Actions → Release → Run workflow, or `gh workflow run release.yml --ref
# <branch>`) rehearses a release: every gate and `npm publish --dry-run`, with no npm token and
# no GitHub Release. Only a tag push publishes. Same shape as FetchXML Studio, Dataverse Request
# Studio and Command Bar Studio.
#
# - build: read-only. Every gate, then packs the 16 tarballs (pnpm pack rewrites workspace:*)
#   and writes the release notes from the packages' CHANGELOG sections.
# - live: the live integration suite, in the same concurrency group as the nightly run, so
#   two suites never share the org at once.
# - publish: the only job that can get the npm OIDC token, and only for a tag push. It installs
#   no project dependencies and publishes the tarballs build packed. Each package needs one
#   trusted publisher: this file (release.yml) and the `npm` environment (RELEASING.md).
# - github-release: the only job that can write to the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release run per ref at a time; a running publish is never cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.channel.outputs.version }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      latest: ${{ steps.channel.outputs.latest }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # choosing the channel needs main's and support/*'s history
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a release build
      - name: Check the versions, the CHANGELOGs and the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-release.mjs
          fi
      - name: Choose the release channel
        id: channel
        run: |
          # RELEASING.md: -beta.N / -rc.N -> npm "beta" (GitHub pre-release). A stable tag on
          # support/X.Y -> "support-X.Y", never "latest". A stable tag on main -> "latest", but
          # only for main's own release line: support branches merge forward into main, so an
          # older line's commit can be on main too and mustn't move "latest" back.
          # Anything else fails here, so a stray tag can't replace "latest".
          version="$(node scripts/check-release.mjs --version)"
          case "$version" in
            *-beta.*|*-rc.*)
              dist_tag=beta; latest=false; prerelease=true ;;
            *-*)
              echo "::error::Unsupported pre-release $version. Use -beta.N or -rc.N (RELEASING.md)."
              exit 1 ;;
            *)
              prerelease=false
              line="${version%.*}"
              main_version="$(git show origin/main:packages/dataverse-sdk-core/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
              if git rev-parse --verify --quiet "origin/support/$line" >/dev/null &&
                 git merge-base --is-ancestor "$GITHUB_SHA" "origin/support/$line"; then
                dist_tag="support-$line"; latest=false
              elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [ "$line" = "${main_version%.*}" ]; then
                dist_tag=latest; latest=true
              elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                # A rehearsal never publishes, so a stable version that isn't on main yet (dev,
                # a release/X.Y or hotfix branch) still runs every gate and the dry run
                echo "::warning::Stable version $version is on neither main's release line ($main_version) nor support/$line, so a tag here would fail. Rehearsing as \"latest\"."
                dist_tag=latest; latest=true
              else
                echo "::error::Stable version $version is on neither main's release line ($main_version) nor support/$line. Tag the release-prep merge on main (RELEASING.md)."
                exit 1
              fi ;;
          esac
          echo "Publishing $version to npm \"$dist_tag\" (GitHub latest: $latest, pre-release: $prerelease)"
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and critical)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm build
      - name: Generated packages match the $metadata snapshot
        run: |
          pnpm --filter generate-sdk-types regen > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | head -50
            echo "::error::Run 'pnpm --filter generate-sdk-types regen' and commit the result."
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Check package exports, types and require() (publint, attw)
        run: pnpm check:packages
      - name: Install Chromium for Playwright
        run: pnpm --filter @mohsinonxrm/dataverse-sdk-browser-tests exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:browser
      - name: Write the release notes
        run: node scripts/check-release.mjs --notes "$RUNNER_TEMP/release-notes.md" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Pack the published packages
        run: |
          # pnpm pack writes real versions for workspace:* dependencies, as `pnpm publish` would
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            if [ "$(node -p "require('./${dir}package.json').private === true")" = true ]; then continue; fi
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs" > /dev/null)
          done
          count="$(ls "$RUNNER_TEMP"/tarballs/*.tgz | wc -l)"
          echo "Packed $count packages"
          test "$count" -eq 16
          for t in "$RUNNER_TEMP"/tarballs/*.tgz; do
            if tar -xOzf "$t" package/package.json | grep -q '"workspace:'; then
              echo "::error::$t still has a workspace: dependency"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  live:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The nightly Integration Tests run uses the same group: one live suite on the org at a time
    concurrency:
      group: integration-tests
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live integration tests (dev org)
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          DATAVERSE_INTEGRATION_REQUIRED: "1"
        run: pnpm test:integration

  publish:
    needs: [build, live]
    # Only a tag push can get the npm token; a manual run, even on a tag, rehearses
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    environment: npm # the trusted publishers name this environment
    permissions:
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: tarballs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11.21.1 (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Core first, so a consumer installing mid-publish finds it. A version already on npm
          # is skipped, so re-running a partly failed publish finishes it.
          for t in $(ls tarballs/*-core-*.tgz; ls tarballs/*.tgz | grep -v -- '-core-'); do
            name="$(tar -xOzf "$t" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "::notice::$name@$VERSION is already on npm; skipped."
              continue
            fi
            npm publish "$t" --provenance --access public --tag "$DIST_TAG"
          done

  rehearse:
    needs: [build, live]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {} # no npm token: provenance and the token exchange aren't rehearsed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: tarballs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 11.21.1
        run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Rehearse the publish (npm publish --dry-run)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for t in tarballs/*.tgz; do
            name="$(tar -xOzf "$t" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
            # npm's dry run still refuses a version that's already published
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "::notice::$name@$VERSION is already on npm; bump the version to rehearse its publish."
              continue
            fi
            npm publish "$t" --access public --tag "$DIST_TAG" --dry-run
          done

  github-release:
    needs: [build, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      # The notes check-release.mjs wrote (the version's CHANGELOG entries, merged across the
      # packages, and the package list), then GitHub's generated list of PRs and the compare link
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.build.outputs.latest }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes --latest="$LATEST" --prerelease="$PRERELEASE"
