version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor/patch dev-dependency updates.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # One PR for all minor/patch production-dependency updates.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript minor upgrades — track manually. Majors too: TypeScript 6 makes options this
      # repo uses (baseUrl, esModuleInterop false) errors, so the move is its own work (#569).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The packages support Node 22+, so @types/node stays at the oldest supported major (22):
      # newer majors type APIs that Node 22 doesn't have. Minor and patch updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry JS packages are released together (core, resources, sdk-trace-base,
      # context-async-hooks, ... share a version line). appinsights hands its resource to
      # @azure/monitor-opentelemetry, which (1.21.0) depends on the 2.x line, so the package's peer
      # ranges and the tests stay on it. Lift this when Azure Monitor moves to 3 (see #549).
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Actions are pinned by commit SHA; bump them together in one PR.
      github-actions:
        patterns: ["*"]
